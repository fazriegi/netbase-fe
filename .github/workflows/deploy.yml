name: Docker Build & Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BASE_URL=${{ vars.VITE_BASE_URL || 'http://localhost:8080' }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'NetBase' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote Server (VPS)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Verify SSH Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::warning::SSH_HOST or SSH_KEY secret is not configured in GitHub repository secrets. Skipping remote deployment step."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote Deployment via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.REMOTE_TARGET_DIR || '~/netbase-fe' }}"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            echo "Authenticating with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Writing production compose configuration..."
            echo 'services:
              web:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: netbase-fe
                restart: always
                environment:
                  TZ: Asia/Jakarta
                ports:
                  - "127.0.0.1:${{ vars.PORT || '3000' }}:80"' > docker-compose.prod.yml

            echo "Pulling latest Docker image..."
            docker compose -f docker-compose.prod.yml pull

            echo "Stopping old container if exists..."
            docker stop netbase-fe 2>/dev/null || true
            docker rm netbase-fe 2>/dev/null || true

            echo "Deploying container..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "Deployment successful!"
